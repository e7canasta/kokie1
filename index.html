<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>v6</title>
      <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F6F5F3;
        }
        #root {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        html, body, #root, * {
          -webkit-user-select: none;  /* Chrome, Safari, Android */
          -moz-user-select: none;     /* Firefox */
          -ms-user-select: none;      /* IE/Edge */
          user-select: none;          /* Estándar */
          -webkit-touch-callout: none; /* Deshabilita el menú de "Guardar imagen" en iOS/Android */
        }
    </style>
  </head>
  <body>
    <!-- Liquid Glass Fullscreen Button (top right, non-intrusive) -->
    <button id="liquid-glass-btn"
      style="
        position: fixed;
        bottom: 120px;
        right: 18px;
        z-index: 1000;
        padding: 14px 19px;
        border-radius: 16px;
        border: none;
        backdrop-filter: blur(13px) saturate(120%);
        background: linear-gradient(120deg, rgba(255,255,255,0.51), rgba(200,220,240,0.34) 70%, rgba(230,235,255,0.62));
        box-shadow: 0 3px 24px 0 rgba(80,100,150,0.11);
        font-family: inherit;
        font-weight: 500;
        font-size: 1rem;
        color: #32507e;
        cursor: pointer;
        transition: box-shadow .18s, backdrop-filter .14s;
      "
      onclick="
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().then(function() {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('portrait').catch(function() {});
            }
          }).catch(function() {});
        } else {
          document.exitFullscreen();
        }
      "
      title="Toggle fullscreen"
    >
      <svg width='21' height='21' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-3px; margin-right:7px;'><rect x='3' y='3' width='7' height='7' rx='2' /><rect x='14' y='3' width='7' height='7' rx='2' /><rect x='14' y='14' width='7' height='7' rx='2' /><rect x='3' y='14' width='7' height='7' rx='2' /></svg>
      Fullscreen
    </button>
    
    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
